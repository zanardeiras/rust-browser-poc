[package]
name = "rust-browser-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = "0.18"
once_cell = "1.19"
glib = "0.18"
gio = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
webkit2gtk-sys = "2.0"
cairo-rs = "0.18"
gdk-pixbuf = "0.18"
pango = "0.18"
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
